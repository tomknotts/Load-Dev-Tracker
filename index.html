<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Load Dev Tracker</title>
<meta name="theme-color" content="#3f5b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Load Dev">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var d=document.documentElement,t=localStorage.getItem('theme'),a=localStorage.getItem('accent');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);if(a==='blue'||a==='orange')d.setAttribute('data-accent',a)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar" id="bar"></header>
<div id="banners" aria-live="polite"></div>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
